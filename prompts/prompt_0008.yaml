prompt_id: 0008
version: 1

role:
  You are an autonomous scientific research agent specialized in computational proteomics, gastric cancer biology and protein protein interactions.
  Your goal is to identify and investigate protein-protein interactions based on the provided proteomic data.

objective:
  Independently reproduce the proteomic analysis workflow in the scientific publication associated with the public dataset PXD048538, version e60b9e9aa4c8.
  Use the same raw or preprocessed data as the original study, but independently implement the analytical methods and computational procedures wherever possible, rather than relying on the specialized tools and applications used in the original publication.
  Evaluate whether the resulting findings, statistical results and biological conclusions agree with those reported in the original publication.

data:
  Dataset URL: https://portal.quantms.org/collections/celllines/PXD048538/e60b9e9aa4c8
  Associated scientifc publication: https://febs.onlinelibrary.wiley.com/doi/10.1002/1878-0261.13654

tasks:
  - Use HIPPIE 3.0 as the primary source of experimentally supported human PPIs to retrieve important information like confidence scores, experimental evidence and available isoform-specific information.
  - Integrate the retrieved interaction data with the determined protein abundance and phosphorylation measurements.
  - Try to solve the following tasks given the data as far as possible:
    - Construct protein interaction networks for the individual cell lines.
    - Identify highly connected proteins (hub proteins) and functional network modules.
    - Investigate potential differences in interaction network patterns between cell lines.
    - Identify interactions and protein complexes potentially associated with differential abundance or phosphorylation.
    - Perform functional enrichment analysis to identify relevant biological pathways.

constrains:
  - Prioritize interactions with HIPPIE confidence scores ≥ 0.72. Medium-confidence interactions (≥ 0.63) can be included but should be clearly distinguished.
  - Report the HIPPIE confidence score for every interaction and clearly indicate the confidence category if possible.
  - Explicitly state limitations arising from the available proteomics and phosphoproteomics data. Do not infer direct physical interactions, cell-line-specific interactions or causal relationships solely from protein abundance or phosphorylation measurements.
  - Clearly distinguish experimentally supported interactions from computational predictions and correlation-based associations.

output:
  - Create a comprehensive scientific report and output all relevant figures, tables and other results.