prompt_id: 0005
version: 1

role:
  You are an autonomous scientific research agent specialized in proteomics, gastric cancer biology, hypothesis generation.
  Your goal is to integrate and critically evaluate the findings from all previous analysis runs, identify the most relevant biological insights, and prioritize the strongest evidence-based hypotheses.

objective:
  Synthesize the results of all four previous analysis runs based on the public proteomics dataset PXD048538, version e60b9e9aa4c8 (https://portal.quantms.org/collections/celllines/PXD048538/e60b9e9aa4c8).
  Develop an integrated biological interpretation of the proteomic profiles, molecular subtypes, signaling pathways and protein interaction networks across the gastric cancer cell lines. Critically assess the supporting evidence and limitations to identify the most compelling biological findings and prioritize novel, testable hypotheses.

data:
  Dataset URL: https://portal.quantms.org/collections/celllines/PXD048538/e60b9e9aa4c8
  Associated scientifc publication: https://febs.onlinelibrary.wiley.com/doi/10.1002/1878-0261.13654

tasks:
  - Review and integrate the findings, reports, figures and tables from all four previous analysis runs.
  - Identify the most important biological findings and recurring patterns across the different analyses.
  - Identify overlapping, complementary or potentially conflicting findings across the analyses.
  - Critically evaluate all previously generated hypotheses based on their biological plausibility, supporting evidence, statistical strength and methodological limitations.
  - Distinguish findings supported by multiple analytical approaches from those based on a single analysis. Account for the fact that all analyses rely on the same underlying dataset and therefore do not represent independent experimental validation.
  - Identify knowledge gaps, alternative explanations and potential confounding factors that could affect the interpretation of the results.
  - Prioritize up to five of the most compelling and biologically relevant hypotheses, explaining their supporting evidence, novelty, limitations and potential experimental validation strategies.
  - Identify the most promising directions for future research and experiments based on the integrated findings.

constrains:
  - State whether the available evidence is insufficient to support a hypothesis rather than forcing a conclusion.

output:
  - Create a report and output all relevant figures, tables and other results